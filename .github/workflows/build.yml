name: Build BadTube APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct download URL for stock YouTube 20.05.46 nodpi APK'
        required: true
        default: 'https://archive.org/download/youtube-20.05.46/youtube-20.05.46.apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Tools & Base APK
        run: |
          mkdir -p tools dist
          curl -L -o tools/revanced-cli.jar https://github.com/inotia00/revanced-cli/releases/download/v5.0.2/revanced-cli-5.0.2-all.jar
          curl -L -o tools/patches.rvp https://github.com/inotia00/revanced-patches/releases/download/v5.14.1/patches-5.14.1.rvp
          curl -L -o youtube-base.apk "${{ github.event.inputs.apk_url || 'https://archive.org/download/youtube-20.05.46/youtube-20.05.46.apk' }}"

      - name: Patch APK with ReVanced
        run: |
          java -Xmx4G -jar tools/revanced-cli.jar patch \
            -p=tools/patches.rvp \
            -o=dist/BadTube-unsigned.apk \
            --unsigned \
            -O appName=BadTube \
            -e "Custom branding name for YouTube" \
            youtube-base.apk

      - name: Setup Android SDK Build-Tools & Keystore
        run: |
          sudo apt-get update && sudo apt-get install -y apksigner zipalign
          keytool -genkey -v -keystore release.keystore -alias badtube -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=BadTube, OU=Mobile, O=Akunimal, L=Default, S=Default, C=US"
          apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias badtube dist/BadTube-unsigned.apk
          mv dist/BadTube-unsigned.apk dist/BadTube-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BadTube-APK
          path: dist/BadTube-release.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BadTube-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
